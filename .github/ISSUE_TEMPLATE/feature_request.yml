name: 💡 Feature Request
description: Propose a new feature, OEM driver addition, or enhancement for Driver Hub
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Driver Hub even better? We'd love to hear your proposal!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a specific problem or device?
      description: A clear description of what problem you are trying to solve (e.g., "I cannot install drivers for Spreadtrum/Unisoc devices...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
      description: How should this feature work in Driver Hub?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New OEM Driver Package (e.g. Qualcomm, Unisoc, Samsung)
        - Platform-Tools / ADB Feature
        - Hardware Diagnostic / Telemetry
        - UI / UX / Animation Improvement
        - Automation / CLI Integration
        - Other
    validations:
      required: true
